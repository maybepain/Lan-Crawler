<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interface Details — {{ interface_name }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }
    .card {
      max-width: 640px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }
    tr:last-child th,
    tr:last-child td {
      border-bottom: none;
    }
    th {
      width: 210px;
      background: #0f172a;
      color: #94a3b8;
      font-weight: 600;
    }
    td {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #f8fafc;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Interface Details</h1>

  <div class="card">
    <table>
      <tbody>
        <tr>
          <th>Interface Name</th>
          <td>{{ interface_name or "N/A" }}</td>
        </tr>
        <tr>
          <th>IPv4 Address</th>
          <td>{{ ipv4address or "N/A" }}</td>
        </tr>
        <tr>
          <th>IPv4 Subnet Mask</th>
          <td>{{ ipv4address_subnet or "N/A" }}</td>
        </tr>
        <tr>
          <th>IPv4 Broadcast</th>
          <td>{{ ipv4address_broadcast or "N/A" }}</td>
        </tr>
        <tr>
          <th>IPv6 Address</th>
          <td>{{ ipv6address or "N/A" }}</td>
        </tr>
        <tr>
          <th>MAC Address</th>
          <td>{{ mac_address or "N/A" }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
