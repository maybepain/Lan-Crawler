<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAN Discovery Tool</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }
    .card {
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
    }
    p {
      margin-top: 0;
      margin-bottom: 16px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    button[type="submit"] {
      padding: 10px 16px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }
    button[type="submit"]:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the LAN Discovery Tool</h1>
    <p>Start a scan to discover active hosts, MAC addresses, and vendor details on your local network.</p>

    <form method="POST" action="{{ url_for('discovery') }}">
      <button type="submit">Run Scan &amp; Continue</button>
    </form>
  </div>
</body>
</html>
