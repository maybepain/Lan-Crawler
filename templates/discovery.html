<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neighbor Discovery</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }
    table {
      width: 100%;
      max-width: 820px;
      border-collapse: collapse;
      font-size: 0.9rem;
      background: #1e293b;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #334155;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Neighbor Discovery</h1>

  <table>
    <thead>
      <tr>
        <th>IP Address</th>
        <th>MAC Address</th>
        <th>Device / Vendor</th>
      </tr>
    </thead>
    <tbody>
      {% for ip, mac_name in ip_recieved.items() %}
        {% set vendor_name = ip_vendor_name_list.get(ip) %}
        {% if vendor_name is not none %}
          <tr>
            <td>{{ ip }}</td>
            <td>{{ mac_name }}</td>
            <td>{{ vendor_name }}</td>
          </tr>
        {% endif %}
      {% else %}
        <tr>
          <td colspan="3">No neighbors discovered yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
